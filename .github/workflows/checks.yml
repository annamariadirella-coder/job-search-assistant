name: Scanner checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/apps_script.test.cjs
      - run: node tests/search_profile.test.cjs
      - run: node tests/audit_scan.test.cjs
      - run: node tests/board_audit.test.cjs
